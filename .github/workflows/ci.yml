name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: No audio or generated artifacts in repo
        run: python scripts/check_no_audio_in_repo.py
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Licence audit tables are current
        run: python packaging/notices.py audit --check
      - name: Release gate status (information only; the gate itself is enforced by release.yml and build.ps1 -ForRelease)
        run: python packaging/release_gate.py status
      - name: Tests
        run: pytest
      - name: CLI entry point
        run: barbershop-tracks --version
      - name: GUI entry point
        run: barbershop-tracks-gui --smoke-test

  checks-macos:
    # The same checks on macOS (Apple silicon runner). macOS support is new and unverified on a real Mac:
    # see docs/KNOWN-LIMITATIONS.md.
    runs-on: macos-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Licence audit tables are current
        run: python packaging/notices.py audit --check
      - name: Tests
        run: pytest
      - name: CLI entry point
        run: barbershop-tracks --version
      - name: GUI entry point
        run: barbershop-tracks-gui --smoke-test

  render-host:
    # Builds the production render host against the pinned OpenUtau source and runs the tests that
    # drive the real host with a generated synthetic voicebank (no user voicebank involved).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Build the render host (pinned OpenUtau 0.1.565, patched; BLT's own worldline.dll with MSVC and CMake)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File host/build.ps1
      - name: Verify what the host contains (no Voicevox types, no GPL spline, dictionaries)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File host/verify-host.ps1 -HostDir research-output/host/build -OpenUtauSrc research-output/openutau-src
      - name: No removed data (English plus dictionary, C+V template, other packs) anywhere in the host
        run: python -I packaging/verify_absent_data.py research-output/host/build --openutau-src research-output/openutau-src --without-g2p-model
      - name: The host contains exactly what the reviewed allow-list names (phonemizers, embedded data, g2p model)
        run: python -I packaging/verify_host_inventory.py research-output/host/build --g2p-model excluded
      - name: FFmpeg for the MP3 test (CI only; BLT never bundles it)
        run: |
          # chocolatey's community feed answered 504 on three runs in a row (not our code): try a few times before failing
          foreach ($attempt in 1..5) {
            if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { break }
            choco install ffmpeg -y --no-progress
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "attempt $attempt of 5 failed; waiting"
            Start-Sleep -Seconds (20 * $attempt)
          }
          ffmpeg -version | Select-Object -First 1
      - name: Host and rendering tests
        run: pytest -m integration tests/integration
      - name: The INTERNAL RESEARCH host with the g2p model (still builds, matches the allow-list, renders; never packaged or released)
        env:
          BLT_HOST_DIR: ${{ github.workspace }}/research-output/host/build-g2p-research
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File host/build.ps1 -IncludeG2pModel
          powershell -NoProfile -ExecutionPolicy Bypass -File host/verify-host.ps1 -HostDir research-output/host/build-g2p-research -OpenUtauSrc research-output/openutau-src
          python -I packaging/verify_host_inventory.py research-output/host/build-g2p-research --g2p-model included
          pytest -m integration tests/integration/test_render_host.py
      - name: Negative control - the checks must REFUSE a host built from the unpatched OpenUtau (Voicevox, plus dictionary, C+V)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File host/negative-control.ps1

  render-host-macos:
    # The same host build and checks on macOS, once per architecture (each is built and tested on a Mac of
    # its own kind: Apple silicon and Intel). BLT's own libworldline.dylib is built with clang and CMake.
    name: render-host-macos (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Build the render host (pinned OpenUtau 0.1.565, patched; BLT's own libworldline.dylib with clang and CMake)
        run: host/build.sh
      - name: Verify what the host contains (no Voicevox types, no GPL spline, dictionaries)
        run: python host/verify_host.py research-output/host/build research-output/openutau-src
      - name: No removed data (English plus dictionary, C+V template, other packs) anywhere in the host
        run: python -I packaging/verify_absent_data.py research-output/host/build --openutau-src research-output/openutau-src --without-g2p-model
      - name: The host contains exactly what the reviewed allow-list names (phonemizers, embedded data, g2p model)
        run: python -I packaging/verify_host_inventory_macos.py research-output/host/build --g2p-model excluded
      - name: FFmpeg for the MP3 test (CI only; BLT never bundles it)
        run: |
          for attempt in 1 2 3 4 5; do
            if command -v ffmpeg >/dev/null 2>&1; then break; fi
            brew install ffmpeg && break
            echo "attempt $attempt of 5 failed; waiting"
            sleep $((20 * attempt))
          done
          ffmpeg -version | head -n 1
      - name: Host and rendering tests
        run: pytest -m integration tests/integration
      - name: Negative control - the checks must REFUSE a host built from the unpatched OpenUtau (Voicevox, plus dictionary, C+V)
        run: python host/negative_control.py

  package:
    # Builds the Windows package and installer from pinned inputs, audits every file in it against
    # packaging/components.json, smoke-tests it in a stripped environment, then installs, upgrades and
    # uninstalls it. The installer is NOT uploaded anywhere: only text metadata is kept, and nothing is
    # published (that is a manual decision once the licensing blockers in docs/dependency-audit.md and
    # the acceptance gates are cleared).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install the pinned build environment
        run: |
          python -m pip install -r packaging/requirements-build.txt
          python -m pip install -e . --no-deps
      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build the package and installer (smoke tests included)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/build.ps1
      - name: Host tests against the shipped (pruned, self-contained) host
        env:
          BLT_HOST_DIR: ${{ github.workspace }}/research-output/release/host
          BLT_HOST_SELF_CONTAINED: "1"
        run: |
          python -m pip install -e ".[dev]"
          pytest -m integration tests/integration
      - name: Install, upgrade and uninstall the installer
        run: >
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging/installer-test.ps1
          -Installer research-output/release/artifacts/BLT-Music-Generator-*-Setup.exe
          -App "research-output/release/app/BLT Music Generator" -NoGui
      - name: Keep the text metadata (not the installer)
        uses: actions/upload-artifact@v4
        with:
          name: package-metadata
          path: |
            research-output/release/artifacts/SHA256SUMS.txt
            research-output/release/artifacts/RELEASE-STATUS.txt
            research-output/release/artifacts/release-info.json
            research-output/release/artifacts/inventory.json
            research-output/release/artifacts/NOTICES.txt

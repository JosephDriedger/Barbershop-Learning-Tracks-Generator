name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: No audio or generated artifacts in repo
        run: python scripts/check_no_audio_in_repo.py
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Tests
        run: pytest
      - name: CLI entry point
        run: barbershop-tracks --version
      - name: GUI entry point
        run: barbershop-tracks-gui --smoke-test

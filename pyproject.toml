[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "barbershop-learning-tracks"
version = "0.1.0"
description = "BLT Music Generator: four-part barbershop learning tracks from MusicXML."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "PySide6>=6.7",
    "defusedxml>=0.7.1",
    "mido>=1.3",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "mypy>=1.10",
    "ruff>=0.5",
    "pyinstaller>=6.0",
    "pyyaml>=6.0",  # research tooling only (scripts/research/openutau); not a runtime dependency
]

[project.scripts]
barbershop-tracks = "barbershop_tracks.cli:main"

[project.gui-scripts]
barbershop-tracks-gui = "barbershop_tracks.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
barbershop_tracks = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["scripts/research/openutau"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "integration: needs external tools (FFmpeg, OpenUtau); skipped when unavailable",
    "gui: starts a Qt application (runs offscreen)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N", "C4", "PT", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/barbershop_tracks/ui/**" = ["N802"]  # Qt overrides use camelCase

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
mypy_path = ["tests", "scripts/research/openutau"]
exclude = ["^research-output/"]  # downloaded research material (git-ignored), never our code
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["mido", "mido.*", "defusedxml", "defusedxml.*", "yaml", "yaml.*"]
ignore_missing_imports = true
